services:
  - type: web
    name: matchmind
    env: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: matchmind-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: REPORTS_DIR
        value: /data/reports
      - key: USERS_FILE
        value: /data/users.json
      - key: PYTHONUNBUFFERED
        value: 1
