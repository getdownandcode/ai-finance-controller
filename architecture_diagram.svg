<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="MatchMind system architecture">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1D4ED8"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .h1 { font-size: 27px; font-weight: 800; fill: #0F172A; }
    .sub { font-size: 12.5px; fill: #64748B; letter-spacing: .06em; }
    .zone { font-size: 12px; font-weight: 800; letter-spacing: .12em; fill: #64748B; }
    .bt { font-size: 16px; font-weight: 700; fill: #0F172A; }
    .bd { font-size: 12.5px; fill: #475569; }
    .it { font-size: 13px; font-weight: 600; }
    .num { font-size: 12px; font-weight: 800; fill: #FFFFFF; }
    .lg { font-size: 12px; fill: #475569; }
    .cap { font-size: 12px; font-style: italic; fill: #64748B; }
  </style>

  <!-- page -->
  <rect x="0" y="0" width="1920" height="1080" fill="#E8EDF3"/>
  <rect x="20" y="20" width="1880" height="1040" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- header -->
  <text x="52" y="66" class="sans h1">MatchMind — System Architecture</text>
  <text x="52" y="92" class="mono sub">USER → DASHBOARD → ORCHESTRATOR → MATCHING + AI → RESULTS · DETERMINISTIC FIRST, AI FOR AMBIGUOUS CASES ONLY</text>
  <g>
    <line x1="1330" y1="52" x2="1368" y2="52" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#aB)"/>
    <text x="1376" y="56" class="sans lg">data flow</text>
    <line x1="1478" y1="52" x2="1516" y2="52" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aS)"/>
    <text x="1524" y="56" class="sans lg">async / persist</text>
    <line x1="1658" y1="52" x2="1696" y2="52" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aP)"/>
    <text x="1704" y="56" class="sans lg">external AI call</text>
    <text x="1330" y="82" class="sans lg">16:9 · one-slide overview · code-free — see docs for implementation detail</text>
  </g>

  <!-- zone captions -->
  <text x="48" y="176" class="sans zone">EXTERNAL INPUTS</text>
  <text x="945" y="176" class="sans zone" text-anchor="middle">MATCHMIND — AUTONOMOUS FINANCIAL RECONCILIATION SYSTEM</text>
  <text x="1580" y="506" class="sans zone">EXTERNAL AI SERVICE</text>

  <!-- ============ LEFT: inputs ============ -->
  <g>
    <g transform="translate(48,200)">
      <rect x="0" y="0" width="252" height="64" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
      <rect x="0" y="0" width="7" height="64" rx="3.5" fill="#64748B"/>
      <text x="22" y="27" class="sans bt" font-size="15">Finance Analyst</text>
      <text x="22" y="47" class="sans bd">uploads · reviews · approves</text>
    </g>
    <g transform="translate(48,276)">
      <rect x="0" y="0" width="252" height="64" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
      <rect x="0" y="0" width="7" height="64" rx="3.5" fill="#64748B"/>
      <text x="22" y="27" class="sans bt" font-size="15">Bank Transactions</text>
      <text x="22" y="47" class="sans bd">CSV statements + feeds</text>
    </g>
    <g transform="translate(48,352)">
      <rect x="0" y="0" width="252" height="64" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
      <rect x="0" y="0" width="7" height="64" rx="3.5" fill="#64748B"/>
      <text x="22" y="27" class="sans bt" font-size="15">Ledger / Invoices</text>
      <text x="22" y="47" class="sans bd">books · bills · credit notes</text>
    </g>
    <g transform="translate(48,428)">
      <rect x="0" y="0" width="252" height="64" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
      <rect x="0" y="0" width="7" height="64" rx="3.5" fill="#64748B"/>
      <text x="22" y="27" class="sans bt" font-size="15">Gateway / Payouts</text>
      <text x="22" y="47" class="sans bd">settlements · fee deductions</text>
    </g>
    <g transform="translate(48,504)">
      <rect x="0" y="0" width="252" height="64" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
      <rect x="0" y="0" width="7" height="64" rx="3.5" fill="#64748B"/>
      <text x="22" y="27" class="sans bt" font-size="15">Opening Balances</text>
      <text x="22" y="47" class="sans bd">starting cash + metadata</text>
    </g>
    <!-- bus -->
    <line x1="318" y1="232" x2="318" y2="536" stroke="#64748B" stroke-width="2"/>
    <line x1="300" y1="232" x2="318" y2="232" stroke="#64748B" stroke-width="2" marker-end="url(#aS)"/>
    <line x1="300" y1="308" x2="318" y2="308" stroke="#64748B" stroke-width="2" marker-end="url(#aS)"/>
    <line x1="300" y1="384" x2="318" y2="384" stroke="#64748B" stroke-width="2" marker-end="url(#aS)"/>
    <line x1="300" y1="460" x2="318" y2="460" stroke="#64748B" stroke-width="2" marker-end="url(#aS)"/>
    <line x1="300" y1="536" x2="318" y2="536" stroke="#64748B" stroke-width="2" marker-end="url(#aS)"/>
    <line x1="318" y1="245" x2="556" y2="245" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#aB)"/>
  </g>

  <!-- ============ BOUNDARY ============ -->
  <rect x="330" y="150" width="1230" height="860" rx="12" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/>

  <!-- API layer -->
  <g transform="translate(560,195)">
    <rect x="0" y="0" width="760" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <text x="24" y="32" class="sans bt">Presentation &amp; API Layer</text>
    <text x="24" y="53" class="sans bd">Upload data · review matches · handle exceptions · export reports</text>
    <g class="sans" text-anchor="middle">
      <rect x="420" y="14" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#3B82F6"/><text x="495" y="34" class="it" font-size="12.5" fill="#1D4ED8">Dashboard</text>
      <rect x="578" y="14" width="86" height="30" rx="15" fill="#FFFFFF" stroke="#3B82F6"/><text x="621" y="34" class="it" font-size="12.5" fill="#1D4ED8">Auth</text>
      <rect x="420" y="50" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#3B82F6"/><text x="495" y="70" class="it" font-size="12.5" fill="#1D4ED8">REST API</text>
      <rect x="578" y="50" width="158" height="30" rx="15" fill="#FFFFFF" stroke="#3B82F6"/><text x="657" y="70" class="it" font-size="12.5" fill="#1D4ED8">Sessions</text>
    </g>
  </g>
  <line x1="940" y1="295" x2="940" y2="305" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#aB)"/>

  <!-- Orchestrator -->
  <g transform="translate(560,305)">
    <rect x="0" y="0" width="760" height="175" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="24" y="32" class="sans bt">Reconciliation Orchestrator</text>
    <text x="24" y="53" class="sans bd">Runs the end-to-end workflow, step by step</text>
    <g class="sans" text-anchor="middle">
      <rect x="24" y="66" width="168" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6"/><circle cx="46" cy="88" r="11" fill="#1D4ED8"/><text x="46" y="92" class="num">1</text><text x="103" y="92" font-size="12.5" font-weight="600" fill="#0F172A">Ingestion</text>
      <rect x="200" y="66" width="168" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6"/><circle cx="222" cy="88" r="11" fill="#1D4ED8"/><text x="222" y="92" class="num">2</text><text x="279" y="92" font-size="12.5" font-weight="600" fill="#0F172A">Normalize</text>
      <rect x="376" y="66" width="168" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6"/><circle cx="398" cy="88" r="11" fill="#1D4ED8"/><text x="398" y="92" class="num">3</text><text x="455" y="92" font-size="12.5" font-weight="600" fill="#0F172A">Compare</text>
      <rect x="552" y="66" width="168" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6"/><circle cx="574" cy="88" r="11" fill="#1D4ED8"/><text x="574" y="92" class="num">4</text><text x="631" y="92" font-size="12.5" font-weight="600" fill="#0F172A">Candidates</text>
      <rect x="120" y="118" width="168" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6"/><circle cx="142" cy="140" r="11" fill="#1D4ED8"/><text x="142" y="144" class="num">5</text><text x="199" y="144" font-size="12.5" font-weight="600" fill="#0F172A">Evaluate</text>
      <rect x="296" y="118" width="168" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6"/><circle cx="318" cy="140" r="11" fill="#1D4ED8"/><text x="318" y="144" class="num">6</text><text x="375" y="144" font-size="12.5" font-weight="600" fill="#0F172A">Exceptions</text>
      <rect x="472" y="118" width="168" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6"/><circle cx="494" cy="140" r="11" fill="#1D4ED8"/><text x="494" y="144" class="num">7</text><text x="551" y="144" font-size="12.5" font-weight="600" fill="#0F172A">Synthesize</text>
    </g>
  </g>
  <line x1="940" y1="480" x2="940" y2="490" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#aB)"/>

  <!-- Matching engine : full width tiers -->
  <g transform="translate(360,490)">
    <rect x="0" y="0" width="1180" height="215" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
    <text x="590" y="32" class="sans bt" text-anchor="middle">Matching Engine</text>
    <text x="590" y="53" class="sans cap" text-anchor="middle">Deterministic stages run first — only ambiguous cases reach AI reasoning</text>
    <g>
      <rect x="24" y="66" width="262" height="124" rx="9" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
      <text x="155" y="94" class="sans bt" font-size="15" text-anchor="middle">Tier 1 · Exact</text>
      <text x="155" y="116" class="sans bd" text-anchor="middle">Identical records</text>
      <text x="155" y="134" class="sans bd" text-anchor="middle">Highest confidence</text>
      <rect x="40" y="148" width="230" height="24" rx="12" fill="#ECFDF5"/><text x="155" y="165" class="sans lg" text-anchor="middle" fill="#047857">auto-match</text>
      <rect x="24" y="66" width="262" height="124" rx="9" fill="none" stroke="#047857" stroke-width="3"/>
      <rect x="310" y="66" width="262" height="124" rx="9" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
      <text x="441" y="94" class="sans bt" font-size="15" text-anchor="middle">Tier 2 · Batch</text>
      <text x="441" y="116" class="sans bd" text-anchor="middle">Many-to-one groups</text>
      <text x="441" y="134" class="sans bd" text-anchor="middle">Splits + bulk payouts</text>
      <rect x="326" y="148" width="230" height="24" rx="12" fill="#ECFDF5"/><text x="441" y="165" class="sans lg" text-anchor="middle" fill="#047857">auto-match</text>
      <rect x="596" y="66" width="262" height="124" rx="9" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
      <text x="727" y="94" class="sans bt" font-size="15" text-anchor="middle">Tier 3 · Fuzzy</text>
      <text x="727" y="116" class="sans bd" text-anchor="middle">Similar, scored records</text>
      <text x="727" y="134" class="sans bd" text-anchor="middle">Near-ties → exception</text>
      <rect x="612" y="148" width="230" height="24" rx="12" fill="#ECFDF5"/><text x="727" y="165" class="sans lg" text-anchor="middle" fill="#047857">auto-match if clear</text>
      <rect x="882" y="66" width="274" height="124" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
      <text x="1019" y="94" class="sans bt" font-size="15" text-anchor="middle" fill="#5B21B6">Tier 4 · AI Reasoning</text>
      <text x="1019" y="116" class="sans bd" text-anchor="middle">Ambiguous cases only</text>
      <text x="1019" y="134" class="sans bd" text-anchor="middle">Fees · tax · twins</text>
      <rect x="900" y="148" width="238" height="24" rx="12" fill="#7C3AED"/><text x="1019" y="165" class="sans lg" text-anchor="middle" fill="#FFFFFF">via Google Gemini</text>
      <polygon points="286,122 298,128 286,134" fill="#059669"/>
      <polygon points="572,122 584,128 572,134" fill="#059669"/>
      <polygon points="858,122 870,128 858,134" fill="#7C3AED"/>
    </g>
  </g>
  <!-- Gemini link -->
  <line x1="1540" y1="612" x2="1576" y2="612" stroke="#7C3AED" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#aP)"/>
  <text x="1558" y="600" class="sans lg" text-anchor="middle" fill="#7C3AED">ambiguous only</text>

  <line x1="940" y1="705" x2="940" y2="715" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#aB)"/>

  <!-- Policy -->
  <g transform="translate(560,715)">
    <rect x="0" y="0" width="760" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
    <text x="24" y="37" class="sans bt" font-size="15">Policy &amp; Validation</text>
    <g class="sans" text-anchor="middle">
      <rect x="252" y="15" width="152" height="30" rx="15" fill="#FFFFFF" stroke="#D97706"/><text x="328" y="35" font-size="12.5" font-weight="600" fill="#92400E">Confidence gates</text>
      <rect x="412" y="15" width="130" height="30" rx="15" fill="#FFFFFF" stroke="#D97706"/><text x="477" y="35" font-size="12.5" font-weight="600" fill="#92400E">Approvals</text>
      <rect x="550" y="15" width="182" height="30" rx="15" fill="#FFFFFF" stroke="#D97706"/><text x="641" y="35" font-size="12.5" font-weight="600" fill="#92400E">Limits + safety checks</text>
    </g>
  </g>

  <!-- fan-out -->
  <line x1="940" y1="775" x2="940" y2="795" stroke="#1D4ED8" stroke-width="2.5"/>
  <line x1="543" y1="795" x2="1326" y2="795" stroke="#1D4ED8" stroke-width="2.5"/>
  <line x1="543" y1="795" x2="543" y2="810" stroke="#047857" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="940" y1="795" x2="940" y2="810" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#aB)"/>
  <line x1="1326" y1="795" x2="1326" y2="810" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#aB)"/>

  <!-- outputs -->
  <g transform="translate(360,810)">
    <rect x="0" y="0" width="366" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
    <text x="24" y="32" class="sans bt" font-size="15" fill="#065F46">Reconciled Results</text>
    <text x="24" y="58" class="sans bd">• Matched transactions</text>
    <text x="24" y="80" class="sans bd">• Match confidence score</text>
    <text x="24" y="102" class="sans bd">• Reconciliation summary</text>
  </g>
  <g transform="translate(746,810)">
    <rect x="0" y="0" width="366" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
    <text x="24" y="32" class="sans bt" font-size="15" fill="#991B1B">Exception Queue</text>
    <text x="24" y="58" class="sans bd">• Unmatched records</text>
    <text x="24" y="80" class="sans bd">• Ambiguous matches</text>
    <text x="24" y="102" class="sans bd">• Analyst review required</text>
  </g>
  <g transform="translate(1132,810)">
    <rect x="0" y="0" width="388" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <text x="24" y="32" class="sans bt" font-size="15" fill="#1E40AF">Reports &amp; Audit</text>
    <text x="24" y="58" class="sans bd">• Reconciliation report</text>
    <text x="24" y="80" class="sans bd">• Audit log + evaluation metrics</text>
    <text x="24" y="102" class="sans bd">• Export — back to dashboard</text>
  </g>

  <!-- storage -->
  <g transform="translate(360,950)">
    <rect x="0" y="0" width="1160" height="40" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="24" y="26" class="sans bt" font-size="14">Session &amp; History Storage</text>
    <text x="330" y="26" class="sans bd">past runs, decisions and reports retained per user</text>
  </g>
  <line x1="543" y1="940" x2="543" y2="950" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aS)"/>
  <line x1="1326" y1="940" x2="1326" y2="950" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aS)"/>

  <!-- ============ RIGHT: Gemini ============ -->
  <g transform="translate(1580,530)">
    <rect x="0" y="0" width="292" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="24" y="34" class="sans bt" font-size="16" fill="#5B21B6">Google Gemini</text>
    <text x="24" y="56" class="sans bd">External AI service</text>
    <text x="24" y="82" class="sans bd">• Ambiguous matches only</text>
    <text x="24" y="104" class="sans bd">• Bounded by policy gates</text>
    <text x="24" y="126" class="sans bd">• Never owns the pipeline</text>
  </g>
</svg>
