app = "ai-finance-controller"
primary_region = "bom" # Mumbai - closest to India, change to sin/iad if needed

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RECON_LLM_MODEL = "gemini-2.5-flash"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
